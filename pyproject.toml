[project]
name = "sarai"
version = "0.1.0"
description = "Sarai AI - self-hosted Thai/English meeting minutes generator"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    # Both processes render documents: the worker on job completion, the API
    # when the user edits the minutes and the .docx has to match the screen.
    "python-docx>=1.1",
    "weasyprint>=62",
]

# Opt-in extras. `suplime` adds the SUPlime-L diarization pipeline
# (rewayai/suplime-large). Its weights are CC BY-NC 4.0 -- non-commercial only --
# so it is never a default; select it with DIARIZATION_MODEL. Install with
# `make install-suplime` (or add `--extra suplime` to the worker sync).
[project.optional-dependencies]
suplime = ["suplime>=0.2"]

# torch lives ONLY in the `worker` group. The API process must never be able to
# import it -- see tests/test_no_torch_in_api.py
[dependency-groups]
api = [
    "fastapi>=0.111",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "aiofiles>=23.2",
]
worker = [
    "torch>=2.2",
    "torchaudio>=2.2",
    "transformers>=4.44",
    "accelerate>=0.33",
    "pyannote.audio>=3.3",
    "soundfile>=0.12",
    "numpy>=1.26",
    "httpx>=0.27",
    "anthropic>=0.69",
    "pythainlp>=5.0",
    # Apple Silicon only: mlx ships no wheels for anything else, and a CUDA
    # box has no use for it. The ASR backend falls back to transformers
    # wherever this is absent.
    "mlx-whisper>=0.4; sys_platform == 'darwin' and platform_machine == 'arm64'",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "ruff>=0.5",
    "mypy>=1.10",
    "httpx>=0.27",
    "types-aiofiles>=23.2",
    # The worker's pure helpers (turn shaping, hallucination guard, stages with
    # models stubbed) are tested in CI without torch. These are what they import.
    "numpy>=1.26",
    "soundfile>=0.12",
    "anthropic>=0.69",
    "pythainlp>=5.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sarai"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.lint.flake8-bugbear]
# FastAPI's whole dependency system is function calls in argument defaults.
extend-immutable-calls = [
    "fastapi.Depends", "fastapi.File", "fastapi.Form", "fastapi.Query", "fastapi.Body",
]

[tool.mypy]
# No python_version pin: numpy's bundled stubs use `type` statements, which
# mypy refuses to parse when told to target 3.11. Checking runs against the
# interpreter in use instead.
strict = true
files = ["sarai", "scripts", "tests"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["pyannote.*", "transformers.*", "torch.*", "torchaudio.*", "pythainlp.*", "soundfile.*", "docx.*", "lxml.*", "anthropic.*", "mlx.*", "mlx_whisper.*", "weasyprint.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["ignore::DeprecationWarning"]
